<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@yourname</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

  :root{
    --bg-0:#0b0a12;
    --accent:#b98cff;
    --accent-2:#5eead4;
    --text-0:#f4f2fa;
    --text-1:#a9a4bf;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.10);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    min-height:100%;
    font-family:'Plus Jakarta Sans', sans-serif;
    background:var(--bg-0);
    color:var(--text-0);
  }

  /* ---------- พื้นหลังหลังเว็บ: วิดีโอพื้นหลัง (MP4) เปลี่ยนไฟล์ใน <source> ด้านล่าง body ---------- */
  .bg-wrap{
    position:fixed; inset:0;
    z-index:0;
    overflow:hidden;
  }
  .bg-wrap video{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%) scale(1.15);
    object-fit:cover;
    filter:blur(28px) brightness(0.4) saturate(1.2);
  }
  .bg-wrap::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 20%, rgba(185,140,255,0.18), transparent 60%),
               linear-gradient(180deg, rgba(11,10,18,0.4), rgba(11,10,18,0.92));
  }

  .stage{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .card{
    width:100%; max-width:360px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:22px;
    overflow:hidden;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    opacity:0;
    transform:translateY(14px);
    animation:rise .7s ease forwards;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .cover{
    width:100%;
    height:112px;
    background-color:#1c1830;
    background-size:cover;
    background-position:center;
  }

  .card-body{
    text-align:center;
    padding:0 26px 24px;
  }

  .avatar-wrap{
    position:relative;
    width:96px; height:96px;
    margin:-48px auto 16px;
  }
  .avatar-wrap::before{
    content:"";
    position:absolute; inset:-4px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent));
    animation:spin 5s linear infinite;
  }
  .avatar{
    position:relative;
    width:96px; height:96px;
    border-radius:50%;
    background:#1c1830 center/cover no-repeat;
    border:3px solid var(--bg-0);
  }
  .badge{
    position:absolute; bottom:2px; right:2px;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--accent-2);
    border:3px solid var(--bg-0);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .name{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px;
    font-weight:700;
    margin-bottom:4px;
  }
  .uid{
    font-size:12px;
    color:var(--text-1);
    letter-spacing:.3px;
    margin-bottom:14px;
  }
  .bio{
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-1);
    margin-bottom:22px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .link{
    display:flex; align-items:center; gap:12px;
    width:100%;
    padding:12px 16px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--card-border);
    border-radius:12px;
    color:var(--text-0);
    text-decoration:none;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .link:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,0.08);
    border-color:rgba(185,140,255,0.4);
  }
  .link svg{ width:18px; height:18px; flex-shrink:0; }
  .link span{ flex:1; text-align:left; }
  .link .go{ opacity:.4; font-size:12px; }

  .views{
    font-size:11px;
    color:var(--text-1);
    letter-spacing:.3px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .views b{ color:var(--text-0); font-weight:700; }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent-2); }

  @media (prefers-reduced-motion: reduce){
    .avatar-wrap::before{ animation:none; }
    .card{ animation:none; opacity:1; transform:none; }
  }

  /* ---------- edit panel (local only) ---------- */
  .edit-fab{
    position:fixed; right:16px; bottom:16px; z-index:40;
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid var(--card-border);
    background:rgba(20,17,32,0.85);
    backdrop-filter:blur(10px);
    color:var(--text-0);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .edit-fab:hover{ border-color:rgba(185,140,255,0.5); }

  .edit-panel{
    position:fixed; inset:0; z-index:41;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,0.55);
  }
  .edit-panel.open{ display:flex; }
  .edit-sheet{
    width:100%; max-width:400px;
    background:#151222;
    border:1px solid var(--card-border);
    border-radius:20px 20px 0 0;
    padding:20px 22px 26px;
  }
  .edit-sheet h3{
    font-size:14px;
    font-weight:700;
    margin-bottom:4px;
  }
  .edit-sheet .hint{
    font-size:11.5px;
    color:var(--text-1);
    line-height:1.5;
    margin-bottom:16px;
  }
  .edit-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-top:1px solid var(--card-border);
  }
  .edit-row span{ font-size:13px; font-weight:600; }
  .edit-row .edit-actions{ display:flex; gap:8px; }
  .edit-row label{
    font-size:12px;
    font-weight:600;
    padding:8px 12px;
    border-radius:10px;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--card-border);
    cursor:pointer;
  }
  .edit-row button.reset{
    font-size:12px;
    font-weight:600;
    padding:8px 12px;
    border-radius:10px;
    background:transparent;
    border:1px solid var(--card-border);
    color:var(--text-1);
    cursor:pointer;
  }
  .edit-row input[type=file]{ display:none; }
  .edit-close{
    display:block;
    width:100%;
    margin-top:14px;
    padding:11px;
    text-align:center;
    border-radius:10px;
    background:var(--accent);
    color:#181225;
    font-weight:700;
    font-size:13px;
    border:none;
    cursor:pointer;
  }
</style>
</head>
<body>

  <div class="bg-wrap">
    <!-- วิดีโอพื้นหลัง: ไฟล์ bg.mp4 อยู่ที่ root ของเว็บ (สูงขึ้นไป 1 ชั้นจากไฟล์นี้) -->
    <video autoplay muted loop playsinline>
      <source src="../bg.mp4" type="video/mp4">
    </video>
  </div>

  <button class="edit-fab" id="editFab" type="button" title="แก้ไขรูป">✎</button>

  <div class="edit-panel" id="editPanel">
    <div class="edit-sheet">
      <h3>เปลี่ยนรูป (เห็นเฉพาะเครื่องนี้)</h3>
      <p class="hint">รูปที่เปลี่ยนจะบันทึกไว้ในเบราว์เซอร์นี้เท่านั้น คนอื่นที่เข้าเว็บจากเครื่อง/เบราว์เซอร์อื่นจะไม่เห็นการเปลี่ยนแปลง</p>

      <div class="edit-row">
        <span>ปกโปรไฟล์</span>
        <div class="edit-actions">
          <label>เลือกรูป<input type="file" accept="image/*" data-target="cover"></label>
          <button class="reset" data-reset="cover" type="button">รีเซ็ต</button>
        </div>
      </div>
      <div class="edit-row">
        <span>รูปโปรไฟล์</span>
        <div class="edit-actions">
          <label>เลือกรูป<input type="file" accept="image/*" data-target="avatar"></label>
          <button class="reset" data-reset="avatar" type="button">รีเซ็ต</button>
        </div>
      </div>

      <button class="edit-close" id="editClose" type="button">เสร็จแล้ว</button>
    </div>
  </div>

  <div class="stage">
    <div class="card">
      <!-- ปกโปรไฟล์: เปลี่ยน URL ในบรรทัดนี้เป็นรูปปกของคุณ -->
      <div class="cover" id="coverEl" style="background-image:url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=1200&auto=format&fit=crop');"></div>

      <div class="card-body">
        <div class="avatar-wrap">
          <div class="avatar" id="avatarEl" style="background-image:url('https://api.dicebear.com/7.x/thumbs/svg?seed=yourname');"></div>
          <div class="badge"></div>
        </div>

        <div class="name">yourname</div>
        <div class="uid">UID 000,000</div>
        <div class="bio">แก้ข้อความตรงนี้เป็นแนะนำตัวสั้น ๆ ของคุณ ✦</div>

        <div class="links">
          <a class="link" href="https://www.facebook.com/chayodom.pongtui?locale=th_TH" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5H16l.5-3.5h-3V7.7c0-1 .3-1.7 1.8-1.7H16.6V2.9C16.2 2.9 15 2.8 13.7 2.8c-2.8 0-4.7 1.7-4.7 4.8v2.4H6v3.5h3v7.5h4.5Z"/></svg>
            <span>Facebook</span>
            <span class="go">↗</span>
          </a>
          <a class="link" href="https://www.instagram.com/chayodom.6549/" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069Zm0 2.163c-3.148 0-3.517.012-4.755.069-2.457.111-3.605 1.281-3.716 3.716-.057 1.237-.068 1.605-.068 4.753s.012 3.517.068 4.754c.111 2.433 1.256 3.605 3.716 3.716 1.238.056 1.605.069 4.755.069 3.148 0 3.518-.013 4.755-.069 2.456-.111 3.606-1.28 3.716-3.716.057-1.237.069-1.606.069-4.754s-.012-3.516-.069-4.753c-.11-2.437-1.257-3.605-3.716-3.716-1.237-.057-1.607-.069-4.755-.069Zm0 3.677a5.997 5.997 0 1 1 0 11.994 5.997 5.997 0 0 1 0-11.994Zm0 9.891a3.894 3.894 0 1 0 0-7.788 3.894 3.894 0 0 0 0 7.788Zm6.406-10.121a1.44 1.44 0 1 1-2.88 0 1.44 1.44 0 0 1 2.88 0Z"/></svg>
            <span>Instagram</span>
            <span class="go">↗</span>
          </a>
          <a class="link" href="https://youtube.com" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
            <span>YouTube</span>
            <span class="go">↗</span>
          </a>
        </div>

        <div class="views"><span class="dot"></span>ผู้เข้าชม <b id="viewCount">0</b></div>
      </div>
    </div>
  </div>

<script>
  const viewCount = document.getElementById('viewCount');
  function animateViews(){
    const target = Math.floor(Math.random()*400) + 100;
    let n = 0;
    const step = Math.ceil(target/40);
    const iv = setInterval(() => {
      n += step;
      if(n >= target){ n = target; clearInterval(iv); }
      viewCount.textContent = n.toLocaleString();
    }, 24);
  }
  animateViews();

  /* ---------- local-only image customization ---------- */
  const STORE_PREFIX = 'biolink_img_';
  const targets = {
    cover:  document.getElementById('coverEl'),
    avatar: document.getElementById('avatarEl')
  };

  // โหลดรูปที่เคยบันทึกไว้ในเบราว์เซอร์นี้ (ถ้ามี)
  Object.keys(targets).forEach(key => {
    const saved = localStorage.getItem(STORE_PREFIX + key);
    if(saved){
      targets[key].style.backgroundImage = `url('${saved}')`;
    }
  });

  const editFab   = document.getElementById('editFab');
  const editPanel = document.getElementById('editPanel');
  const editClose = document.getElementById('editClose');

  editFab.addEventListener('click', () => editPanel.classList.add('open'));
  editClose.addEventListener('click', () => editPanel.classList.remove('open'));
  editPanel.addEventListener('click', (e) => {
    if(e.target === editPanel) editPanel.classList.remove('open');
  });

  document.querySelectorAll('input[type=file][data-target]').forEach(input => {
    input.addEventListener('change', (e) => {
      const file = e.target.files[0];
      const key = e.target.dataset.target;
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        targets[key].style.backgroundImage = `url('${dataUrl}')`;
        try{
          localStorage.setItem(STORE_PREFIX + key, dataUrl);
        }catch(err){
          alert('รูปใหญ่เกินไป บันทึกไม่สำเร็จ ลองรูปที่เล็กลง');
        }
      };
      reader.readAsDataURL(file);
    });
  });

  document.querySelectorAll('button[data-reset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.reset;
      localStorage.removeItem(STORE_PREFIX + key);
      location.reload();
    });
  });
</script>
</body>
</html>
