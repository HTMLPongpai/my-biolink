<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@yourname</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

  :root{
    --bg-0:#0b0a12;
    --bg-1:#151222;
    --accent:#b98cff;
    --accent-2:#5eead4;
    --text-0:#f4f2fa;
    --text-1:#a9a4bf;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.10);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    font-family:'Plus Jakarta Sans', sans-serif;
    background:var(--bg-0);
    color:var(--text-0);
    overflow:hidden;
  }

  /* ---------- background ---------- */
  .bg{
    position:fixed; inset:0;
    background-image:url('https://images.unsplash.com/photo-1502442598385-3f5b17d1f8b3?q=80&w=1400&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    filter:blur(38px) brightness(0.35) saturate(1.2);
    transform:scale(1.15);
    z-index:0;
  }
  .bg::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 20%, rgba(185,140,255,0.18), transparent 60%),
               linear-gradient(180deg, rgba(11,10,18,0.4), rgba(11,10,18,0.92));
  }

  /* ---------- click to enter ---------- */
  #gate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-0);
    cursor:pointer;
    transition:opacity .6s ease;
  }
  #gate .gate-inner{
    text-align:center;
    animation:pulse 2.2s ease-in-out infinite;
  }
  #gate .ring{
    width:64px; height:64px;
    margin:0 auto 18px;
    border-radius:50%;
    border:2px solid var(--card-border);
    border-top-color:var(--accent);
    animation:spin 1.1s linear infinite;
  }
  #gate p{
    letter-spacing:.4px;
    font-size:13px;
    color:var(--text-1);
    text-transform:uppercase;
    font-weight:600;
  }
  #gate span{ color:var(--text-0); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
  #gate.hidden{ opacity:0; pointer-events:none; }

  /* ---------- page ---------- */
  .stage{
    position:relative; z-index:1;
    height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .card{
    width:100%; max-width:360px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:32px 26px 24px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    text-align:center;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .7s ease, transform .7s ease;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  .card.show{ opacity:1; transform:translateY(0); }

  .avatar-wrap{
    position:relative;
    width:96px; height:96px;
    margin:0 auto 16px;
  }
  .avatar-wrap::before{
    content:"";
    position:absolute; inset:-4px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent));
    animation:spin 5s linear infinite;
  }
  .avatar{
    position:relative;
    width:96px; height:96px;
    border-radius:50%;
    background:#1c1830 center/cover no-repeat;
    border:3px solid var(--bg-0);
  }
  .badge{
    position:absolute; bottom:2px; right:2px;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--accent-2);
    border:3px solid var(--bg-0);
  }

  .name{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px;
    font-weight:700;
    margin-bottom:4px;
  }
  .uid{
    font-size:12px;
    color:var(--text-1);
    letter-spacing:.3px;
    margin-bottom:14px;
  }
  .bio{
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-1);
    margin-bottom:22px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .link{
    display:flex; align-items:center; gap:12px;
    padding:12px 16px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--card-border);
    border-radius:12px;
    color:var(--text-0);
    text-decoration:none;
    font-size:13.5px;
    font-weight:600;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .link:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,0.08);
    border-color:rgba(185,140,255,0.4);
  }
  .link svg{ width:18px; height:18px; flex-shrink:0; }
  .link span{ flex:1; text-align:left; }
  .link .go{ opacity:.4; font-size:12px; }

  .views{
    font-size:11px;
    color:var(--text-1);
    letter-spacing:.3px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .views b{ color:var(--text-0); font-weight:700; }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent-2); }

  @media (prefers-reduced-motion: reduce){
    #gate .ring, .avatar-wrap::before{ animation:none; }
  }
</style>
</head>
<body>

  <div class="bg"></div>

  <div id="gate">
    <div class="gate-inner">
      <div class="ring"></div>
      <p><span>click</span> to enter</p>
    </div>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="avatar-wrap">
        <div class="avatar" style="background-image:url('https://api.dicebear.com/7.x/thumbs/svg?seed=yourname');"></div>
        <div class="badge"></div>
      </div>

      <div class="name">yourname</div>
      <div class="uid">UID 000,000</div>
      <div class="bio">แก้ข้อความตรงนี้เป็นแนะนำตัวสั้น ๆ ของคุณ ✦</div>

          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>

          <span class="go">↗</span>
        </a>
      </div>

      <div class="views"><span class="dot"></span>ผู้เข้าชม <b id="viewCount">0</b></div>
    </div>
  </div>

<script>
  const gate = document.getElementById('gate');
  const card = document.getElementById('card');
  const viewCount = document.getElementById('viewCount');

  gate.addEventListener('click', () => {
    gate.classList.add('hidden');
    setTimeout(() => gate.remove(), 700);
    card.classList.add('show');
    animateViews();
  });

  function animateViews(){
    const target = Math.floor(Math.random()*400) + 100;
    let n = 0;
    const step = Math.ceil(target/40);
    const iv = setInterval(() => {
      n += step;
      if(n >= target){ n = target; clearInterval(iv); }
      viewCount.textContent = n.toLocaleString();
    }, 24);
  }
</script>
</body>
</html>
